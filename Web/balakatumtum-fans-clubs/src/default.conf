server {
    listen       80;
    server_name  _;

    # Buffer settings for reading POST body
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_body_in_file_only off;
    client_body_in_single_buffer on;

    # Check query parameters and URI for :constructor
    if ($args_has_constructor = 1) {
        return 403 "Forbidden: :constructor detected in query parameters";
    }

    if ($uri_has_constructor = 1) {
        return 403 "Forbidden: :constructor detected in URI";
    }

    # Location to check POST body content
    location / {
        # Read body and check for :constructor
        access_by_lua_block {
            local ngx = ngx
            local method = ngx.var.request_method
            
            if method == "POST" or method == "PUT" or method == "PATCH" then
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                
                if body and string.find(body, ":constructor", 1, true) then
                    ngx.status = 403
                    ngx.say("Forbidden: :constructor detected in request body")
                    ngx.exit(403)
                end
            end
        }

        # Proxy to Next.js app
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Preserve request body
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;
        proxy_request_buffering off;
    }
}

