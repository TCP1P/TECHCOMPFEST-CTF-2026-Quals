version: '3.8'

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: nextjs-app
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./flag.txt:/flag.txt:ro
    environment:
      - NODE_ENV=production

  nginx:
    image: openresty/openresty:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./nginx-custom.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:

