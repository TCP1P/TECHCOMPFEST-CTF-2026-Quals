# Custom nginx.conf for OpenResty with :constructor filtering

#user  nobody;
#worker_processes 1;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Buffer settings for reading POST body
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_body_in_file_only off;
    client_body_in_single_buffer on;

    # Map to check query string for :constructor
    map $args $args_has_constructor {
        default 0;
        ~*:constructor 1;
    }

    # Map to check request URI for :constructor
    map $request_uri $uri_has_constructor {
        default 0;
        ~*:constructor 1;
    }

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;

    # Don't reveal OpenResty version to clients.
    # server_tokens off;
}

