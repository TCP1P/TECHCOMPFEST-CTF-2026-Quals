# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/master/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml

name: "super-revenge"
author: "repl"
description: |
  yea, another note challenge. but this time it has super thing you need todo to obtain the flag. because it has super strict csp, super strict authentication and super strict api-call. Welcome to super notes

  http://{{.host}}/{{.slug}}

type: "StaticAttachment"
value: 1000

flags:
  - "TCF{Somebody_extremely_clever_enjoying_tech_beyond_intent}"


provide: "./dist/src.zip"

scripts:
    start: cd src && docker compose -p {{.slug}} up --build -d
    stop: cd src && docker compose -p {{.slug}} down --volumes
    restart:
      interval: 15m
      execute: cd src && docker compose -p {{.slug}} restart