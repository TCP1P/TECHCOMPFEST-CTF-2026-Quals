basePath: /api/v1
definitions:
  dtos.CreateCommentDto:
    properties:
      content:
        type: string
      noteId:
        type: integer
    type: object
  dtos.CreateNoteDto:
    description: Data for creating a new note
    properties:
      content:
        description: |-
          Content of the note
          @example Don't forget to check expiration dates
        example: Don't forget to check expiration dates
        type: string
      description:
        description: |-
          Optional description with details (max 255 characters)
          @example This is a note about my tasks
        example: This is a note about my tasks
        maxLength: 255
        type: string
      public:
        description: |-
          Public status of the note
          @example false
        example: false
        type: boolean
      title:
        description: |-
          Title of the note (3-255 characters)
          @example My First Note
        example: My First Note
        type: string
      userId:
        description: |-
          User ID associated with the note
          @example 1
        example: 1
        type: integer
    required:
    - content
    type: object
  dtos.DeleteCommentDto:
    properties:
      id:
        type: integer
    type: object
  dtos.DeleteNoteDto:
    description: Data for deleting an existing note
    properties:
      id:
        description: |-
          ID of the note to delete
          @example 1
        example: 1
        type: integer
      userId:
        description: |-
          User ID associated with the note
          @example 1
        example: 1
        type: integer
    type: object
  dtos.LoginUserDto:
    description: Login credentials for authenticating a user
    properties:
      email:
        description: |-
          User's email address
          @example john.doe@example.com
        example: john.doe@example.com
        type: string
      password:
        description: |-
          User's password
          @example SecureP@ssw0rd
        example: SecureP@ssw0rd
        type: string
    required:
    - email
    - password
    type: object
  dtos.RegisterUserDto:
    description: Registration data for creating a new user account
    properties:
      confirmPassword:
        description: |-
          Confirmation of the password
          @example SecureP@ssw0rd
        example: SecureP@ssw0rd
        type: string
      email:
        description: |-
          User's email address
          @example john.doe@example.com
        example: john.doe@example.com
        type: string
      name:
        description: |-
          User's full name
          @example John Doe
        example: John Doe
        type: string
      password:
        description: |-
          User's password (min 8 characters)
          @example SecureP@ssw0rd
        example: SecureP@ssw0rd
        type: string
    required:
    - confirmPassword
    - email
    - name
    - password
    type: object
  dtos.StructuredResponse:
    description: Standard response format containing success status, HTTP status code,
      message, and optional payload
    properties:
      message:
        description: |-
          Human-readable message
          @example Operation completed successfully
        example: Operation completed successfully
        type: string
      payload:
        description: |-
          Optional payload containing response data
          @example {"id":1,"name":"Example Item"}
      status:
        description: |-
          HTTP status code
          @example 200
        example: 200
        type: integer
      success:
        description: |-
          Whether the operation was successful
          @example true
        example: true
        type: boolean
    type: object
  dtos.TokenDto:
    description: JWT token used for authenticating requests
    properties:
      token:
        description: |-
          JWT token string
          @example eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - token
    type: object
  dtos.UpdateCommentDto:
    properties:
      content:
        type: string
      id:
        type: integer
    type: object
  dtos.UpdateNoteDto:
    description: Data for updating an existing note
    properties:
      content:
        description: |-
          Updated content of the note
          @example Remember to buy fruits and vegetables
        example: Remember to buy fruits and vegetables
        type: string
      description:
        description: |-
          Updated description (max 255 characters)
          @example This is an updated note about my tasks
        example: This is an updated note about my tasks
        maxLength: 255
        type: string
      id:
        description: |-
          ID of the note to update
          @example 1
        example: 1
        type: integer
      isVisited:
        description: |-
          Updated visited status
          @example true
        example: true
        type: boolean
      title:
        description: |-
          Updated title (3-255 characters)
          @example My Updated Note
        example: My Updated Note
        type: string
      userId:
        description: |-
          User ID associated with the note
          @example 1
        example: 1
        type: integer
    required:
    - content
    type: object
host: localhost:3002
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: A RESTful API for Todo management built with Go and PostgreSQL
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go Boilerplate Beginner Project
  version: "1.0"
paths:
  /auth/check-token:
    post:
      consumes:
      - application/json
      description: Check if the provided JWT token is valid
      parameters:
      - description: JWT token to be validated
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/dtos.TokenDto'
      produces:
      - application/json
      responses:
        "200":
          description: Token is valid
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Invalid token
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      summary: Check token validity
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user with the provided credentials
      parameters:
      - description: User login data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dtos.LoginUserDto'
      produces:
      - application/json
      responses:
        "200":
          description: User logged in successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      summary: Login a user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with the provided details
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dtos.RegisterUserDto'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      summary: Register a new user
      tags:
      - auth
  /comments/delete:
    delete:
      consumes:
      - application/json
      description: Delete an existing comment
      parameters:
      - description: Comment deletion data
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/dtos.DeleteCommentDto'
      produces:
      - application/json
      responses:
        "200":
          description: Comment deleted successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "400":
          description: Invalid payload
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      security:
      - BearerAuth: []
      summary: Delete a comment
      tags:
      - comments
  /comments/edit:
    put:
      consumes:
      - application/json
      description: Update an existing comment
      parameters:
      - description: Comment update data
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateCommentDto'
      produces:
      - application/json
      responses:
        "200":
          description: Comment updated successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "400":
          description: Invalid payload
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "404":
          description: Comment not found
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      security:
      - BearerAuth: []
      summary: Update a comment
      tags:
      - comments
  /comments/new:
    post:
      consumes:
      - application/json
      description: Create a new comment for a note
      parameters:
      - description: Comment data
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateCommentDto'
      produces:
      - application/json
      responses:
        "200":
          description: Comment created successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "400":
          description: Invalid payload
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      security:
      - BearerAuth: []
      summary: Create a comment
      tags:
      - comments
  /comments/note/{noteId}:
    get:
      consumes:
      - application/json
      description: Retrieve all comments belonging to the specified note
      parameters:
      - description: Note ID
        in: path
        name: noteId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Comments retrieved successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "400":
          description: Invalid note ID
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      security:
      - BearerAuth: []
      summary: Get comments for a note
      tags:
      - comments
  /notes/create-note:
    post:
      consumes:
      - application/json
      description: Create a new Note with the provided details
      parameters:
      - description: Note data
        in: body
        name: note
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateNoteDto'
      produces:
      - application/json
      responses:
        "200":
          description: Note created successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      security:
      - BearerAuth: []
      summary: Create a new Note
      tags:
      - notes
  /notes/delete-note:
    delete:
      consumes:
      - application/json
      description: Delete an existing Note by ID
      parameters:
      - description: Note deletion data
        in: body
        name: note
        required: true
        schema:
          $ref: '#/definitions/dtos.DeleteNoteDto'
      produces:
      - application/json
      responses:
        "200":
          description: Note deleted successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      security:
      - BearerAuth: []
      summary: Delete an existing Note
      tags:
      - notes
  /notes/get-my-notes:
    get:
      consumes:
      - application/json
      description: Get all Notes created by the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Notes retrieved successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      security:
      - BearerAuth: []
      summary: Get current user's Notes
      tags:
      - notes
  /notes/get-note-by-id/{noteId}:
    get:
      consumes:
      - application/json
      description: Get a Note by its ID, if it is public or belongs to the user
      parameters:
      - description: Note ID
        in: path
        name: noteId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Note retrieved successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      security:
      - BearerAuth: []
      summary: Get Note by ID
      tags:
      - notes
  /notes/get-notes:
    get:
      consumes:
      - application/json
      description: Get all Notes from the database
      produces:
      - application/json
      responses:
        "200":
          description: Notes retrieved successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      security:
      - BearerAuth: []
      summary: Get all Notes ( admin only, not ready yet )
      tags:
      - notes
  /notes/update-note:
    put:
      consumes:
      - application/json
      description: Update an existing Note with the provided details
      parameters:
      - description: Note update data
        in: body
        name: note
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateNoteDto'
      produces:
      - application/json
      responses:
        "200":
          description: Note updated successfully
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dtos.StructuredResponse'
      security:
      - BearerAuth: []
      summary: Update an existing Note
      tags:
      - notes
securityDefinitions:
  BearerAuth:
    description: 'Enter the token with the `Bearer: ` prefix, e.g. ''Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'''
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
