# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/master/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml

name: "Cosmic Gate"
author: "m3rr"
description: |
  <figure style="position:relative; text-align:center; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; line-height:1.55; max-width:720px; margin:0 auto;">
    <img
      src="https://endfield.wiki.gg/images/thumb/Cosmic_Gate.png/1200px-Cosmic_Gate.png"
      alt="Cosmic Gate"
      style="display:block; width:100%; height:auto; border-radius:18px;"
    />

    <figcaption style="position:absolute; inset:0; border-radius:18px; z-index:2; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color:rgba(255,255,255,.94); text-shadow:0 2px 10px rgba(0,0,0,.9); box-shadow:0 12px 40px rgba(0,0,0,.45);">
      <section style="max-width:640px; width:92%;">
        <p style="margin:8px 0 0;">
          <span style="opacity:.92;">in ancient civilization,</span>
          <strong>Terra</strong>
          <span style="opacity:.92;">was the first</span>
        </p>

        <p style="margin:6px 0 0;">
          <span style="opacity:.92;">within</span>
          <strong>Civilight Eterna</strong>
          <span style="opacity:.92;">they predict</span>
          <strong>Talos-II</strong>
          <span style="opacity:.92;">as the second beacon of hope</span>
        </p>

        <p style="margin:4px 0 0; opacity:.92;">
          The two worlds were once connected, as the history ever told
        </p>

        <p style="margin:100px 0 0;">
          <span style="opacity:.92;">remote(</span><strong>"{{.host}}"</strong><span style="opacity:.92;">,</span>
          <strong>{{.slug}}</strong><span style="opacity:.92;">)</span>
        </p>
      </section>
    </figcaption>
  </figure>

type: "StaticAttachment"
value: 1000

flags:
  - "TCF{don't forget to pre-register and check out Arknights: Endfield on january 22 2026 at https://endfield.gryphline.com}"

provide: "./dist/cosmic_gate.zip"

dashboard:
  type: "compose"
  config: "./src/docker-compose.yml"
